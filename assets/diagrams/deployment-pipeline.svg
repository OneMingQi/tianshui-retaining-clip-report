<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 670" role="img"><title>从仿真验证到真机闭环的证据链</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#253345"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="30" y="40" text-anchor="start" fill="#253345" font-size="20" font-weight="600">(a)</text><text x="69" y="40" text-anchor="start" fill="#253345" font-size="20" font-weight="600">建立可部署的仿真验证</text><rect x="30" y="85" width="350" height="95" rx="4" fill="#edf3f8" stroke="#346997" stroke-width="1.5"/><text x="205.0" y="127.5" text-anchor="middle" fill="#253345" font-size="22" font-weight="600">真实测量</text><text x="205.0" y="157.5" text-anchor="middle" fill="#596677" font-size="17" font-weight="400">接口与参数范围</text><path d="M380 132H430" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><rect x="430" y="85" width="350" height="95" rx="4" fill="#edf3f8" stroke="#346997" stroke-width="1.5"/><text x="605.0" y="127.5" text-anchor="middle" fill="#253345" font-size="22" font-weight="600">模型辨识</text><text x="605.0" y="157.5" text-anchor="middle" fill="#596677" font-size="17" font-weight="400">留出动作检验</text><path d="M780 132H830" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><rect x="830" y="85" width="350" height="95" rx="4" fill="#edf3f8" stroke="#346997" stroke-width="1.5"/><text x="1005.0" y="127.5" text-anchor="middle" fill="#253345" font-size="22" font-weight="600">闭环仿真</text><text x="1005.0" y="157.5" text-anchor="middle" fill="#596677" font-size="17" font-weight="400">合法观测与非理想因素</text><text x="30" y="216" text-anchor="start" fill="#596677" font-size="18" font-weight="400">进入真机的依据：同一观测定义、命令含义、控制程序与任务终点。</text><text x="30" y="288" text-anchor="start" fill="#253345" font-size="20" font-weight="600">(b)</text><text x="69" y="288" text-anchor="start" fill="#253345" font-size="20" font-weight="600">逐步增加真实控制权限</text><rect x="30" y="335" width="260" height="100" rx="4" fill="#edf4f0" stroke="#527969" stroke-width="1.5"/><text x="160.0" y="380.0" text-anchor="middle" fill="#253345" font-size="22" font-weight="600">回放 / 硬件在环</text><text x="160.0" y="410.0" text-anchor="middle" fill="#596677" font-size="17" font-weight="400">时序与保护通道</text><path d="M290 385H330" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><rect x="330" y="335" width="260" height="100" rx="4" fill="#edf4f0" stroke="#527969" stroke-width="1.5"/><text x="460.0" y="380.0" text-anchor="middle" fill="#253345" font-size="22" font-weight="600">低载基础闭环</text><text x="460.0" y="410.0" text-anchor="middle" fill="#596677" font-size="17" font-weight="400">真实接触与零残差</text><path d="M590 385H630" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><rect x="630" y="335" width="260" height="100" rx="4" fill="#edf4f0" stroke="#527969" stroke-width="1.5"/><text x="760.0" y="380.0" text-anchor="middle" fill="#253345" font-size="22" font-weight="600">影子 → 限幅接管</text><text x="760.0" y="410.0" text-anchor="middle" fill="#596677" font-size="17" font-weight="400">先看请求，再看后果</text><path d="M890 385H930" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><rect x="930" y="335" width="260" height="100" rx="4" fill="#edf4f0" stroke="#527969" stroke-width="1.5"/><text x="1060.0" y="380.0" text-anchor="middle" fill="#253345" font-size="22" font-weight="600">完整任务验收</text><text x="1060.0" y="410.0" text-anchor="middle" fill="#596677" font-size="17" font-weight="400">冻结版本 · 全部尝试</text><path d="M1005 180V255H160V335" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><path d="M1060 435V530H560V435" fill="none" stroke="#253345" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="590" y="520" text-anchor="start" fill="#b06838" font-size="18" font-weight="400">失配 → 诊断、更新模型或控制器、重新验证</text><text x="30" y="605" text-anchor="start" fill="#253345" font-size="19" font-weight="600">回放验证软件因果性；真实接触验证闭环后果；完整验收验证最终任务。</text><text x="30" y="641" text-anchor="start" fill="#596677" font-size="17" font-weight="400">各阶段的输入、通过条件和退出条件见正文；尚无真机闭环成绩。</text></g></svg>