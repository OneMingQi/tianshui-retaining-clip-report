<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 450" role="img"><title>载荷交接：落座、开指和几何退出</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#253345"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="30" y="38" text-anchor="start" fill="#253345" font-size="20" font-weight="600">a)</text><text x="69" y="38" text-anchor="start" fill="#253345" font-size="20" font-weight="600">落座并预检</text><rect x="30" y="65" width="350" height="310" rx="4" fill="#f8fafc" stroke="#d4dce4"/><path d="M95 290H315M170 290V250M265 290V250" stroke="#93a0ae" stroke-width="13"/><rect x="200" y="180" width="35" height="110" fill="#b9d0df" stroke="#346997"/><path d="M181 210V145H254V210" fill="none" stroke="#253345" stroke-width="10"/><text x="205" y="345" text-anchor="middle" fill="#596677" font-size="18" font-weight="400">目标误差 · 支撑 · 退出空间</text><path d="M380 210H430" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><text x="430" y="38" text-anchor="start" fill="#253345" font-size="20" font-weight="600">b)</text><text x="469" y="38" text-anchor="start" fill="#253345" font-size="20" font-weight="600">开指与卸载</text><rect x="430" y="65" width="350" height="310" rx="4" fill="#f8fafc" stroke="#d4dce4"/><path d="M495 290H715M570 290V250M665 290V250" stroke="#93a0ae" stroke-width="13"/><rect x="600" y="180" width="35" height="110" fill="#b9d0df" stroke="#346997"/><path d="M553 210V145H682V210" fill="none" stroke="#253345" stroke-width="10"/><path d="M573 220H535" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><path d="M662 220H700" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><text x="605" y="345" text-anchor="middle" fill="#596677" font-size="18" font-weight="400">真实开度 · 工件不随动</text><path d="M780 210H830" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><text x="830" y="38" text-anchor="start" fill="#253345" font-size="20" font-weight="600">c)</text><text x="869" y="38" text-anchor="start" fill="#253345" font-size="20" font-weight="600">让位后回撤</text><rect x="830" y="65" width="350" height="310" rx="4" fill="#f8fafc" stroke="#d4dce4"/><path d="M895 290H1115M970 290V250M1065 290V250" stroke="#93a0ae" stroke-width="13"/><rect x="1000" y="180" width="35" height="110" fill="#b9d0df" stroke="#346997"/><path d="M953 155V90H1082V155" fill="none" stroke="#253345" stroke-width="10"/><path d="M1100 230H1130V100" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><text x="1005" y="345" text-anchor="middle" fill="#596677" font-size="18" font-weight="400">实测退出 · 工件独立保持</text><text x="30" y="425" text-anchor="start" fill="#596677" font-size="18" font-weight="400">示意非按比例；退出走廊必须包含张开夹指的扫掠体积及标定误差余量。</text></g></svg>