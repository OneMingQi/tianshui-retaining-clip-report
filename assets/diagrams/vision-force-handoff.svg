<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 470" role="img"><title>视觉与力觉接力：外部配准、入口精修、接触反馈</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#253345"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="30" y="40" text-anchor="start" fill="#253345" font-size="20" font-weight="600">a)</text><text x="69" y="40" text-anchor="start" fill="#253345" font-size="20" font-weight="600">外部配准</text><rect x="30" y="65" width="350" height="325" rx="4" fill="#f8fafc" stroke="#d4dce4"/><path d="M125 280V160H315V280" fill="none" stroke="#93a0ae" stroke-width="8"/><rect x="205" y="135" width="32" height="170" fill="#b9d0df" stroke="#346997"/><path d="M185 175V110H255V175" fill="none" stroke="#253345" stroke-width="9"/><rect x="65" y="210" width="35" height="24" fill="#edf4f0" stroke="#527969" stroke-width="2"/><path d="M100 222L205 190M100 222L237 270" fill="none" stroke="#527969" stroke-dasharray="4 4"/><text x="205" y="354" text-anchor="middle" fill="#596677" font-size="18" font-weight="400">柜体 / 工具标记 → 相对位姿</text><path d="M380 225H430" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><text x="430" y="40" text-anchor="start" fill="#253345" font-size="20" font-weight="600">b)</text><text x="469" y="40" text-anchor="start" fill="#253345" font-size="20" font-weight="600">入口精修</text><rect x="430" y="65" width="350" height="325" rx="4" fill="#f8fafc" stroke="#d4dce4"/><path d="M525 280V160H715V280" fill="none" stroke="#93a0ae" stroke-width="8"/><rect x="605" y="135" width="32" height="170" fill="#b9d0df" stroke="#346997"/><path d="M585 175V110H655V175" fill="none" stroke="#253345" stroke-width="9"/><rect x="540" y="95" width="35" height="24" fill="#edf4f0" stroke="#527969" stroke-width="2"/><path d="M575 107L605 190M575 107L637 270" fill="none" stroke="#527969" stroke-dashar