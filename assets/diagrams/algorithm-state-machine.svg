<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 430" role="img"><title>阶段调度：通过物理交接门前进，异常进入有界恢复</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#253345"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="30" y="38" text-anchor="start" fill="#253345" font-size="20" font-weight="600">(b)</text><text x="69" y="38" text-anchor="start" fill="#253345" font-size="20" font-weight="600">物理事件驱动的阶段调度</text><rect x="30" y="100" width="170" height="100" rx="4" fill="#edf3f8" stroke="#346997" stroke-width="1.5"/><text x="115.0" y="145.0" text-anchor="middle" fill="#253345" font-size="22" font-weight="600">接近对准</text><text x="115.0" y="175.0" text-anchor="middle" fill="#596677" font-size="17" font-weight="400">入口误差收敛</text><text x="30" y="84" text-anchor="start" fill="#596677" font-size="16" font-weight="400">01</text><path d="M200 150H230" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><rect x="230" y="100" width="170" height="100" rx="4" fill="#edf3f8" stroke="#346997" stroke-width="1.5"/><text x="315.0" y="145.0" text-anchor="middle" fill="#253345" font-size="22" font-weight="600">接触插入</text><text x="315.0" y="175.0" text-anchor="middle" fill="#596677" font-size="17" font-weight="400">进度与载荷相容</text><text x="230" y="84" text-anchor="start" fill="#596677" font-size="16" font-weight="400">02</text><path d="M400 150H430" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><rect x="430" y="100" width="170" height="100" rx="4" fill="#edf3f8" stroke="#346997" stroke-width="1.5"/><text x="515.0" y="145.0" text-anchor="middle" fill="#253345" font-size="22" font-weight="600">落座卸载</text><text x="515.0" y="175.0" text-anchor="middle" fill="#596677" font-size="17" font-weight="400">支撑与路径成立</text><text x="430" y="84" text-anchor="start" fill="#596677" font-size="16" font-weight="400">03</text><path d="M600 150H630" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><rect x="630" y="100" width="170" height="100" rx="4" fill="#edf3f8" stroke="#346997" stroke-width="1.5"/><text x="715.0" y="145.0" text-anchor="middle" fill="#253345" font-size="22" font-weight="600">松爪脱离</text><text x="715.0" y="175.0" text-anchor="middle" fill="#596677" font-size="17" font-weight="400">开度与保持成立</text><text x="630" y="84" text-anchor="start" fill="#596677" font-size="16" font-weight="400">04</text><path d="M800 150H830" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><rect x="830" y="100" width="170" height="100" rx="4" fill="#edf3f8" stroke="#346997" stroke-width="1.5"/><text x="915.0" y="145.0" text-anchor="middle" fill="#253345" font-size="22" font-weight="600">受控回撤</text><text x="915.0" y="175.0" text-anchor="middle" fill="#596677" font-size="17" font-weight="400">实测退出 ≥100 mm</text><text x="830" y="84" text-anchor="start" fill="#596677" font-size="16" font-weight="400">05</text><path d="M1000 150H1030" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><rect x="1030" y="100" width="170" height="100" rx="4" fill="#edf4f0" stroke="#527969" stroke-width="1.5"/><text x="1115.0" y="145.0" text-anchor="middle" fill="#253345" font-size="22" font-weight="600">独立稳定</text><text x="1115.0" y="175.0" text-anchor="middle" fill="#596677" font-size="17" font-weight="400">完整观察 ≥1 s</text><text x="1030" y="84" text-anchor="start" fill="#596677" font-size="16" font-weight="400">06</text><rect x="360" y="290" width="490" height="80" rx="4" fill="#fbf1e6" stroke="#b06838" stroke-width="1.5"/><text x="605.0" y="325.0" text-anchor="middle" fill="#253345" font-size="22" font-weight="600">卸力 / 重观测 / 有限回退</text><text x="605.0" y="355.0" text-anchor="middle" fill="#596677" font-size="17" font-weight="400">证据恢复且预算允许 → 返回原阶段</text><path d="M515 200V290" fill="none" stroke="#253345" stroke-width="1.6" marker-end="url(#arr)"/><text x="530" y="250" text-anchor="start" fill="#596677" font-size="17" font-weight="400">停滞或置信度下降</text><path d="M360 330H290V200" fill="none" stroke="#253345" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="880" y="318" text-anchor="start" fill="#253345" font-size="18" font-weight="600">越界 / 不可行 / 超时</text><text x="880" y="350" text-anchor="start" fill="#596677" font-size="18" font-weight="400">→ 受控停止并记失败</text><text x="30" y="415" text-anchor="start" fill="#596677" font-size="17" font-weight="400">框内第二行是交接证据；详细阈值与异常分支见下表。所有阶段共享完整任务预算。</text></g></svg>