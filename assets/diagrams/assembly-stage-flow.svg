<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 690" role="img" aria-labelledby="title desc"><title id="title">固定夹装配流程与关键失效点</title><desc id="desc">从已抓持初态开始，每阶段同时检查实际动作和物理交接证据。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#257d7d"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ac5b45"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="40" fill="#203e49" font-size="22" font-weight="600">工序</text><text x="370" y="40" fill="#203e49" font-size="22" font-weight="600">交接条件</text><text x="825" y="40" fill="#ac5b45" font-size="22" font-weight="600">主要失效点</text><rect x="30" y="75" width="275" height="60" rx="3" fill="#edf3f8" stroke="#93a0ae"/><text x="50" y="113" fill="#203e49" font-size="23" font-weight="600">01 接近对准</text><path d="M305 105H350" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="370" y="113" fill="#203e49" font-size="21" font-weight="400">入口误差与跟踪成立</text><text x="825" y="113" fill="#ac5b45" font-size="20" font-weight="400">初态偏置 / 入口错位</text><path d="M355 140H1185" stroke="#d9dfe5"/><path d="M165 135V163" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="163" width="275" height="60" rx="3" fill="#edf3f8" stroke="#93a0ae"/><text x="50" y="201" fill="#203e49" font-size="23" font-weight="600">02 接触插入</text><path d="M305 193H350" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="370" y="201" fill="#203e49" font-size="21" font-weight="400">真实推进且载荷允许</text><text x="825" y="201" fill="#ac5b45" font-size="20" font-weight="400">振荡 / 卡滞 / 提前交接</text><path d="M355 228H1185" stroke="#d9dfe5"/><path d="M165 223V251" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="251" width="275" height="60" rx="3" fill="#edf3f8" stroke="#93a0ae"/><text x="50" y="289" fill="#203e49" font-size="23" font-weight="600">03 落座卸载</text><path d="M305 281H350" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="370" y="289" fill="#203e49" font-size="21" font-weight="400">位置、姿态与支撑相容</text><text x="825" y="289" fill="#ac5b45" font-size="20" font-weight="400">只看 Z 到位 / 仍靠夹指承载</text><path d="M355 316H1185" stroke="#d9dfe5"/><path d="M165 311V339" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="339" width="275" height="60" rx="3" fill="#edf3f8" stroke="#93a0ae"/><text x="50" y="377" fill="#203e49" font-size="23" font-weight="600">04 松爪脱离</text><path d="M305 369H350" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="370" y="377" fill="#203e49" font-size="21" font-weight="400">开度实测、工件不随动</text><text x="825" y="377" fill="#ac5b45" font-size="20" font-weight="400">开度饱和 / 刮带 / 回弹</text><path d="M355 404H1185" stroke="#d9dfe5"/><path d="M165 399V427" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="427" width="275" height="60" rx="3" fill="#edf3f8" stroke="#93a0ae"/><text x="50" y="465" fill="#203e49" font-size="23" font-weight="600">05 受控回撤</text><path d="M305 457H350" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="370" y="465" fill="#203e49" font-size="21" font-weight="400">实测退出 ≥100 mm</text><text x="825" y="465" fill="#ac5b45" font-size="20" font-weight="400">不可达 / 扫掠干涉 / 拖带</text><path d="M355 492H1185" stroke="#d9dfe5"/><path d="M165 487V515" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="515" width="275" height="60" rx="3" fill="#edf3f8" stroke="#93a0ae"/><text x="50" y="553" fill="#203e49" font-size="23" font-weight="600">06 独立稳定</text><path d="M305 545H350" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="370" y="553" fill="#203e49" font-size="21" font-weight="400">完整 1 s + 全程质量</text><text x="825" y="553" fill="#ac5b45" font-size="20" font-weight="400">漂移 / 缺窗 / 运动越界</text><path d="M355 580H1185" stroke="#d9dfe5"/><text x="30" y="635" fill="#5a737e" font-size="18" font-weight="400">初态：机器人已经抓住固定夹。每次交接依据实际状态，不以已发送命令代替完成动作。</text><text x="30" y="672" fill="#5a737e" font-size="18" font-weight="400">贯穿全程：受力、跟踪、平滑性与时间预算。原生终点与完整任务终点分别评价。</text></g></svg>