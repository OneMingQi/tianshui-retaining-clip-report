<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc"><title id="title">场景对象、控制闭环与独立评价框图</title><desc id="desc">控制器通过限幅和IK发送机器人及夹指命令，物理场景反馈编码器及腕力；原生策略另读取固定夹真值，独立评价器读取全轨迹。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#257d7d"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ac5b45"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="35" y="43" fill="#203e49" font-size="25" font-weight="650">场景闭环：动作、接触、观测与评分的关系</text><rect x="35" y="90" width="340" height="140" rx="6" fill="#eef5f0" stroke="#afcbc5"/><text x="54" y="122" fill="#203e49" font-size="22" font-weight="650">任务与初始条件</text><text x="54" y="152" fill="#5a737e" font-size="18" font-weight="400">型号、目标槽位、预抓取状态</text><text x="54" y="178" fill="#5a737e" font-size="18" font-weight="400">初始位姿扰动、总时间预算</text><rect x="455" y="90" width="360" height="140" rx="6" fill="#eef5f0" stroke="#afcbc5"/><text x="474" y="122" fill="#203e49" font-size="22" font-weight="650">阶段控制与动作生成</text><text x="474" y="152" fill="#5a737e" font-size="18" font-weight="400">回放 / 柔顺反馈 / 学习修正</text><text x="474" y="178" fill="#5a737e" font-size="18" font-weight="400">输出：末端请求、夹指开度</text><rect x="895" y="90" width="350" height="140" rx="6" fill="#eef5f0" stroke="#afcbc5"/><text x="914" y="122" fill="#203e49" font-size="22" font-weight="650">执行与约束处理</text><text x="914" y="152" fill="#5a737e" font-size="18" font-weight="400">投影 / IK / 关节驱动</text><text x="914" y="178" fill="#5a737e" font-size="18" font-weight="400">请求动作 ≠ 实际执行</text><path d="M375 160H455" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M815 160H895" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1070 230V295" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="455" y="295" width="790" height="245" rx="6" fill="#fafbf8" stroke="#afcbc5"/><text x="477" y="329" fill="#203e49" font-size="23" font-weight="650">物理场景：接触关系随阶段变化</text><rect x="477" y="350" width="223" height="155" rx="6" fill="#eef5f0" stroke="#afcbc5"/><text x="496" y="382" fill="#203e49" font-size="22" font-weight="650">机器人＋夹指</text><text x="496" y="412" fill="#5a737e" font-size="18" font-weight="400">执行运动 / 开合</text><text x="496" y="438" fill="#5a737e" font-size="18" font-weight="400">握持与解除约束</text><rect x="745" y="350" width="210" height="155" rx="6" fill="#eef5f0" stroke="#afcbc5"/><text x="764" y="382" fill="#203e49" font-size="22" font-weight="650">固定夹</text><text x="764" y="412" fill="#5a737e" font-size="18" font-weight="400">被操作工件</text><text x="764" y="438" fill="#5a737e" font-size="18" font-weight="400">位姿 / 速度变化</text><rect x="1000" y="350" width="223" height="155" rx="6" fill="#eef5f0" stroke="#afcbc5"/><text x="1019" y="382" fill="#203e49" font-size="22" font-weight="650">目标工装</text><text x="1019" y="412" fill="#5a737e" font-size="18" font-weight="400">槽位与支撑</text><text x="1019" y="438" fill="#5a737e" font-size="18" font-weight="400">定位 / 承载</text><path d="M700 428H745" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M955 428H1000" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="704" y="465" fill="#5a737e" font-size="15" font-weight="400">抓持</text><text x="958" y="465" fill="#5a737e" font-size="15" font-weight="400">接触</text><rect x="35" y="295" width="340" height="245" rx="6" fill="#eef5f0" stroke="#afcbc5"/><text x="54" y="327" fill="#203e49" font-size="22" font-weight="650">观测与诊断</text><text x="54" y="357" fill="#5a737e" font-size="18" font-weight="400">编码器：末端和夹指运动</text><text x="54" y="383" fill="#5a737e" font-size="18" font-weight="400">腕力 / 力矩：混合受力</text><text x="54" y="409" fill="#5a737e" font-size="18" font-weight="400">固定夹真值：位姿与目标差</text><text x="54" y="435" fill="#5a737e" font-size="18" font-weight="400">录像：定性观察与回看</text><path d="M455 400H375" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M205 295V260H635V230" fill="none" stroke="#257d7d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="221" y="253" fill="#257d7d" font-size="17" font-weight="400">反馈</text><rect x="35" y="610" width="555" height="165" rx="6" fill="#f6eee7" stroke="#dec0a9"/><text x="54" y="642" fill="#203e49" font-size="22" font-weight="650">原生策略的信息边界</text><text x="54" y="672" fill="#5a737e" font-size="18" font-weight="400">原生对准 / 阶段 / 释放仍使用固定夹真值</text><text x="54" y="698" fill="#5a737e" font-size="18" font-weight="400">相机未构成已验证的视觉闭环</text><text x="54" y="724" fill="#5a737e" font-size="18" font-weight="400">上图反馈链不等于纯力觉可部署系统</text><rect x="670" y="610" width="575" height="165" rx="6" fill="#eef5f0" stroke="#afcbc5"/><text x="689" y="642" fill="#203e49" font-size="22" font-weight="650">独立评价与证据存档</text><text x="689" y="672" fill="#5a737e" font-size="18" font-weight="400">保存动作请求、执行结果、受力和阶段</text><text x="689" y="698" fill="#5a737e" font-size="18" font-weight="400">分别判定原生终点、回撤稳定与完整质量</text><text x="689" y="724" fill="#5a737e" font-size="18" font-weight="400">评价结果不应替代控制器的实时观测</text><path d="M850 540V610" fill="none" stroke="#257d7d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="875" y="580" fill="#257d7d" font-size="17" font-weight="400">保存全轨迹后评价</text><path d="M455 485H415V645H590" fill="none" stroke="#ac5b45" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#red)"/><text x="35" y="815" fill="#5a737e" font-size="17" font-weight="400">实线：命令 / 状态流；虚线：真值边界说明或事后证据流。框图为源码与任务结构解读，不是新增实现。</text></g></svg>